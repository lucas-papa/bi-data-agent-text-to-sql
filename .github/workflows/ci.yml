name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint (Ruff) & Test (Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed SQLite E-Commerce Warehouse
        run: python -m scripts.seed_db

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest Suite with Coverage
        run: pytest --cov=backend --cov=scripts --cov-report=term-missing
